<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Catalogue identity and capability model</title>
  <desc id="desc">Core MHCatalogue relationships from marketed Device through item, firmware, Objects, internal slots, builds, and catalogue systems.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50606b"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#50606b"/></marker>
    <style>
      .title{font:600 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17232b}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#50606b}
      .entity-title{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#fff}
      .field{font:400 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#22313a}
      .relation{stroke:#50606b;stroke-width:2;fill:none}
      .dashed{stroke-dasharray:7 6}
      .edge-label{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34444f;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
      .note-box{fill:#fff7df;stroke:#c99416;stroke-width:1.5}
      .note{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#634a11}
      .legend{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#50606b}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="50" y="48" class="title">Catalogue identity and capability model</text>
  <text x="50" y="76" class="subtitle">Core MHCatalogue relationships from marketed Device through item, firmware, Objects, internal slots, builds, and catalogue systems.</text>
  <g class="entity">
    <rect x="50" y="150" width="230" height="130" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M57,150 H273 Q280,150 280,157 V186 H50 V157 Q50,150 57,150" fill="#174d70"/>
    <text x="165" y="174" class="entity-title" text-anchor="middle">EN_DEVICE</text>
    <text x="64" y="207" class="field">PK id_device</text><text x="64" y="227" class="field">FK id_item</text><text x="64" y="247" class="field">FK id_brand / id_line</text><text x="64" y="267" class="field">code (SKU), name</text>
  </g>
<g class="entity">
    <rect x="340" y="150" width="210" height="110" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M347,150 H543 Q550,150 550,157 V186 H340 V157 Q340,150 347,150" fill="#174d70"/>
    <text x="445" y="174" class="entity-title" text-anchor="middle">EN_ITEM</text>
    <text x="354" y="207" class="field">PK id_item</text><text x="354" y="227" class="field">descr</text>
  </g>
<g class="entity">
    <rect x="610" y="130" width="235" height="150" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M617,130 H838 Q845,130 845,137 V166 H610 V137 Q610,130 617,130" fill="#174d70"/>
    <text x="727.5" y="154" class="entity-title" text-anchor="middle">EN_FIRMWARE</text>
    <text x="624" y="187" class="field">PK id_firmware</text><text x="624" y="207" class="field">FK id_item</text><text x="624" y="227" class="field">firmware_V / firmware_R</text><text x="624" y="247" class="field">slots, FW_default</text>
  </g>
<g class="entity">
    <rect x="930" y="110" width="270" height="130" rx="7" fill="#f6f2fb" stroke="#6d55a0" stroke-width="2"/>
    <path d="M937,110 H1193 Q1200,110 1200,117 V146 H930 V117 Q930,110 937,110" fill="#5b3f86"/>
    <text x="1065" y="134" class="entity-title" text-anchor="middle">AS_OBJECT_FIRMWARE</text>
    <text x="944" y="167" class="field">PK id_object_firmware</text><text x="944" y="187" class="field">FK id_firmware</text><text x="944" y="207" class="field">FK id_key_object</text>
  </g>
<g class="entity">
    <rect x="1260" y="110" width="200" height="130" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M1267,110 H1453 Q1460,110 1460,117 V146 H1260 V117 Q1260,110 1267,110" fill="#174d70"/>
    <text x="1360" y="134" class="entity-title" text-anchor="middle">EN_SLOTS</text>
    <text x="1274" y="167" class="field">PK id_slot</text><text x="1274" y="187" class="field">FK id_object_firmware</text><text x="1274" y="207" class="field">first_slot, fixed_ko</text>
  </g>
<g class="entity">
    <rect x="930" y="350" width="240" height="110" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M937,350 H1163 Q1170,350 1170,357 V386 H930 V357 Q930,350 937,350" fill="#174d70"/>
    <text x="1050" y="374" class="entity-title" text-anchor="middle">EN_KEY_OBJECT</text>
    <text x="944" y="407" class="field">PK id_key_object</text><text x="944" y="427" class="field">key_object, id_family</text>
  </g>
<g class="entity">
    <rect x="610" y="370" width="235" height="110" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M617,370 H838 Q845,370 845,377 V406 H610 V377 Q610,370 617,370" fill="#174d70"/>
    <text x="727.5" y="394" class="entity-title" text-anchor="middle">EN_BUILDS</text>
    <text x="624" y="427" class="field">PK id_build</text><text x="624" y="447" class="field">FK id_firmware</text><text x="624" y="467" class="field">firmware_b</text><text x="624" y="487" class="field">localization_level</text>
  </g>
<g class="entity">
    <rect x="340" y="390" width="235" height="120" rx="7" fill="#f6f2fb" stroke="#6d55a0" stroke-width="2"/>
    <path d="M347,390 H568 Q575,390 575,397 V426 H340 V397 Q340,390 347,390" fill="#5b3f86"/>
    <text x="457.5" y="414" class="entity-title" text-anchor="middle">AS_ITEM_SYSTEM</text>
    <text x="354" y="447" class="field">FK id_item / id_system</text><text x="354" y="467" class="field">modobj, main</text>
  </g>
<g class="entity">
    <rect x="50" y="410" width="220" height="120" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M57,410 H263 Q270,410 270,417 V446 H50 V417 Q50,410 57,410" fill="#174d70"/>
    <text x="160" y="434" class="entity-title" text-anchor="middle">EN_SYSTEM</text>
    <text x="64" y="467" class="field">PK id_system</text><text x="64" y="487" class="field">xml_key_system</text><text x="64" y="507" class="field">sys_modobj</text>
  </g>
<g class="entity">
    <rect x="930" y="570" width="240" height="100" rx="7" fill="#f6f2fb" stroke="#6d55a0" stroke-width="2"/>
    <path d="M937,570 H1163 Q1170,570 1170,577 V606 H930 V577 Q930,570 937,570" fill="#5b3f86"/>
    <text x="1050" y="594" class="entity-title" text-anchor="middle">AS_OBJECT_SYSTEM</text>
    <text x="944" y="627" class="field">FK id_key_object</text><text x="944" y="647" class="field">FK id_system</text>
  </g>
<g class="entity">
    <rect x="50" y="650" width="210" height="105" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M57,650 H253 Q260,650 260,657 V686 H50 V657 Q50,650 57,650" fill="#174d70"/>
    <text x="155" y="674" class="entity-title" text-anchor="middle">EN_BRAND</text>
    <text x="64" y="707" class="field">PK id_brand</text><text x="64" y="727" class="field">brand_modobj</text>
  </g>
<g class="entity">
    <rect x="340" y="650" width="210" height="105" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M347,650 H543 Q550,650 550,657 V686 H340 V657 Q340,650 347,650" fill="#174d70"/>
    <text x="445" y="674" class="entity-title" text-anchor="middle">EN_LINE</text>
    <text x="354" y="707" class="field">PK id_line</text><text x="354" y="727" class="field">line_modobj</text>
  </g>
<g>
    <line x1="280" y1="205" x2="340" y2="205" class="relation" marker-end="url(#arrow)"/>
    <text x="310" y="198" class="edge-label" text-anchor="middle">many Devices → one item</text>
  </g>
<g>
    <line x1="550" y1="205" x2="610" y2="205" class="relation" marker-end="url(#arrow)"/>
    <text x="580" y="198" class="edge-label" text-anchor="middle">item firmware</text>
  </g>
<g>
    <line x1="845" y1="205" x2="930" y2="175" class="relation" marker-end="url(#arrow)"/>
    <text x="887.5" y="183" class="edge-label" text-anchor="middle">firmware support</text>
  </g>
<g>
    <line x1="1200" y1="175" x2="1260" y2="175" class="relation" marker-end="url(#arrow)"/>
    <text x="1230" y="168" class="edge-label" text-anchor="middle">placement</text>
  </g>
<g>
    <line x1="1050" y1="240" x2="1050" y2="350" class="relation" marker-end="url(#arrow)"/>
    <text x="1050" y="288" class="edge-label" text-anchor="middle">Object parent</text>
  </g>
<g>
    <line x1="728" y1="280" x2="728" y2="370" class="relation" marker-end="url(#arrow)"/>
    <text x="728" y="318" class="edge-label" text-anchor="middle">0..n builds</text>
  </g>
<g><polyline points="445,260 445,330 458,330 458,390" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="535" y="330" class="edge-label" text-anchor="middle">system association</text></g>
<g>
    <line x1="340" y1="450" x2="270" y2="470" class="relation" marker-end="url(#arrow)"/>
    <text x="305" y="453" class="edge-label" text-anchor="middle">catalogue system</text>
  </g>
<g><polyline points="930,620 810,620 810,470 270,470" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="740" y="606" class="edge-label" text-anchor="middle">Object system</text></g>
<g>
    <line x1="1050" y1="460" x2="1050" y2="570" class="relation" marker-end="url(#arrow)"/>
    <text x="1050" y="508" class="edge-label" text-anchor="middle">Object parent</text>
  </g>
<g><polyline points="150,650 150,585 110,585 110,280" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="90" y="580" class="edge-label" text-anchor="middle">brand</text></g>
<g><polyline points="445,650 445,570 210,570 210,280" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="350" y="558" class="edge-label" text-anchor="middle">line</text></g>
<g><rect x="1170" y="300" width="280" height="34" rx="17" class="note-box"/><text x="1310" y="322" class="note" text-anchor="middle">first_slot is the Device-local position</text></g>
<g><rect x="590" y="540" width="300" height="34" rx="17" class="note-box"/><text x="740" y="562" class="note" text-anchor="middle">V.R.b spans EN_FIRMWARE + EN_BUILDS</text></g>
  <text x="50" y="876" class="legend">Solid arrows show established catalogue relationships. Purple headers are association tables.</text>
</svg>