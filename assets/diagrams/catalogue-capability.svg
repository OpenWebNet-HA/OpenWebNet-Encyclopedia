<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Catalogue identity and capability model</title>
  <desc id="desc">Core MHCatalogue relationships from marketed Device through item, firmware, Objects, internal slots, builds, and catalogue systems.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50606b"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#50606b"/></marker>
    <style>
      .title{font:600 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17232b}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#50606b}
      .entity-title{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#fff}
      .field{font:400 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#22313a}
      .relation{stroke:#50606b;stroke-width:2;fill:none}
      .dashed{stroke-dasharray:7 6}
      .edge-label{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34444f;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
      .note-box{fill:#fff7df;stroke:#c99416;stroke-width:1.5}
      .note{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#634a11}
      .legend{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#50606b}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="50" y="48" class="title">Catalogue identity and capability model</text>
  <text x="50" y="76" class="subtitle">Core MHCatalogue relationships from marketed Device through item, firmware, Objects, internal slots, builds, and catalogue systems.</text>
  <g class="entity">
    <rect x="40" y="140" width="230" height="130" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M47,140 H263 Q270,140 270,147 V176 H40 V147 Q40,140 47,140" fill="#174d70"/>
    <text x="155" y="164" class="entity-title" text-anchor="middle">EN_DEVICE</text>
    <text x="54" y="197" class="field">PK id_device</text><text x="54" y="217" class="field">FK id_item</text><text x="54" y="237" class="field">FK id_brand / id_line</text><text x="54" y="257" class="field">code (SKU), name</text>
  </g>
<g class="entity">
    <rect x="330" y="150" width="200" height="110" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M337,150 H523 Q530,150 530,157 V186 H330 V157 Q330,150 337,150" fill="#174d70"/>
    <text x="430" y="174" class="entity-title" text-anchor="middle">EN_ITEM</text>
    <text x="344" y="207" class="field">PK id_item</text><text x="344" y="227" class="field">descr</text>
  </g>
<g class="entity">
    <rect x="590" y="130" width="235" height="150" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M597,130 H818 Q825,130 825,137 V166 H590 V137 Q590,130 597,130" fill="#174d70"/>
    <text x="707.5" y="154" class="entity-title" text-anchor="middle">EN_FIRMWARE</text>
    <text x="604" y="187" class="field">PK id_firmware</text><text x="604" y="207" class="field">FK id_item</text><text x="604" y="227" class="field">firmware_V / firmware_R</text><text x="604" y="247" class="field">slots, FW_default</text>
  </g>
<g class="entity">
