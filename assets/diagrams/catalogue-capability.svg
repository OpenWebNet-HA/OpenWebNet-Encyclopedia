    <path d="M1227,130 H1443 Q1450,130 1450,137 V166 H1220 V137 Q1220,130 1227,130" fill="#174d70"/>
    <text x="1335" y="154" class="entity-title" text-anchor="middle">EN_SLOTS</text>
    <text x="1234" y="187" class="field">PK id_slot</text><text x="1234" y="207" class="field">FK id_object_firmware</text><text x="1234" y="227" class="field">first_slot, fixed_ko</text>
  </g>
<g class="entity">
    <rect x="25" y="405" width="200" height="105" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M32,405 H218 Q225,405 225,412 V441 H25 V412 Q25,405 32,405" fill="#174d70"/>
    <text x="125" y="429" class="entity-title" text-anchor="middle">EN_BRAND</text>
    <text x="39" y="462" class="field">PK id_brand</text><text x="39" y="482" class="field">brand_modobj</text>
  </g>
<g class="entity">
    <rect x="255" y="405" width="200" height="105" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M262,405 H448 Q455,405 455,412 V441 H255 V412 Q255,405 262,405" fill="#174d70"/>
    <text x="355" y="429" class="entity-title" text-anchor="middle">EN_LINE</text>
    <text x="269" y="462" class="field">PK id_line</text><text x="269" y="482" class="field">line_modobj</text>
  </g>
<g class="entity">
    <rect x="500" y="390" width="235" height="120" rx="7" fill="#f6f2fb" stroke="#6d55a0" stroke-width="2"/>
    <path d="M507,390 H728 Q735,390 735,397 V426 H500 V397 Q500,390 507,390" fill="#5b3f86"/>
    <text x="617.5" y="414" class="entity-title" text-anchor="middle">AS_ITEM_SYSTEM</text>
    <text x="514" y="447" class="field">FK id_item / id_system</text><text x="514" y="467" class="field">modobj, main</text>
  </g>
<g class="entity">
    <rect x="775" y="385" width="235" height="130" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M782,385 H1003 Q1010,385 1010,392 V421 H775 V392 Q775,385 782,385" fill="#174d70"/>
    <text x="892.5" y="409" class="entity-title" text-anchor="middle">EN_BUILDS</text>
    <text x="789" y="442" class="field">PK id_build</text><text x="789" y="462" class="field">FK id_firmware</text><text x="789" y="482" class="field">firmware_b</text><text x="789" y="502" class="field">localization_level</text>
  </g>
<g class="entity">
    <rect x="1060" y="390" width="240" height="110" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M1067,390 H1293 Q1300,390 1300,397 V426 H1060 V397 Q1060,390 1067,390" fill="#174d70"/>
    <text x="1180" y="414" class="entity-title" text-anchor="middle">EN_KEY_OBJECT</text>
    <text x="1074" y="447" class="field">PK id_key_object</text><text x="1074" y="467" class="field">key_object, id_family</text>
  </g>
<g class="entity">
    <rect x="500" y="650" width="235" height="120" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M507,650 H728 Q735,650 735,657 V686 H500 V657 Q500,650 507,650" fill="#174d70"/>
    <text x="617.5" y="674" class="entity-title" text-anchor="middle">EN_SYSTEM</text>
    <text x="514" y="707" class="field">PK id_system</text><text x="514" y="727" class="field">xml_key_system</text><text x="514" y="747" class="field">sys_modobj</text>
  </g>
<g class="entity">
    <rect x="1060" y="655" width="240" height="100" rx="7" fill="#f6f2fb" stroke="#6d55a0" stroke-width="2"/>
    <path d="M1067,655 H1293 Q1300,655 1300,662 V691 H1060 V662 Q1060,655 1067,655" fill="#5b3f86"/>
    <text x="1180" y="679" class="entity-title" text-anchor="middle">AS_OBJECT_SYSTEM</text>
    <text x="1074" y="712" class="field">FK id_key_object</text><text x="1074" y="732" class="field">FK id_system</text>
  </g>
<g>
    <line x1="270" y1="205" x2="330" y2="205" class="relation" marker-end="url(#arrow)"/>
    <text x="300" y="198" class="edge-label" text-anchor="middle">many Devices → one item</text>
  </g>
<g>
    <line x1="530" y1="205" x2="590" y2="205" class="relation" marker-end="url(#arrow)"/>
    <text x="560" y="198" class="edge-label" text-anchor="middle">item firmware</text>
  </g>
<g>
    <line x1="825" y1="205" x2="890" y2="195" class="relation" marker-end="url(#arrow)"/>
    <text x="857.5" y="193" class="edge-label" text-anchor="middle">firmware support</text>
  </g>
<g>
    <line x1="1160" y1="195" x2="1220" y2="195" class="relation" marker-end="url(#arrow)"/>
    <text x="1190" y="188" class="edge-label" text-anchor="middle">placement</text>
  </g>
<g><polyline points="90,270 90,330 125,330 125,405" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="125" y="325" class="edge-label" text-anchor="middle">brand</text></g>
<g><polyline points="210,270 210,350 355,350 355,405" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="285" y="344" class="edge-label" text-anchor="middle">line</text></g>
<g><polyline points="430,260 430,330 618,330 618,390" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="525" y="324" class="edge-label" text-anchor="middle">system association</text></g>
<g>
    <line x1="708" y1="280" x2="892" y2="385" class="relation" marker-end="url(#arrow)"/>
    <text x="800" y="325.5" class="edge-label" text-anchor="middle">0..n builds</text>
  </g>
<g>
    <line x1="1025" y1="260" x2="1180" y2="390" class="relation" marker-end="url(#arrow)"/>
    <text x="1102.5" y="318" class="edge-label" text-anchor="middle">Object parent</text>
  </g>
<g>
    <line x1="618" y1="510" x2="618" y2="650" class="relation" marker-end="url(#arrow)"/>
    <text x="618" y="573" class="edge-label" text-anchor="middle">catalogue system</text>
  </g>
<g>
    <line x1="1180" y1="500" x2="1180" y2="655" class="relation" marker-end="url(#arrow)"/>
    <text x="1180" y="570.5" class="edge-label" text-anchor="middle">Object system</text>
  </g>
<g>
    <line x1="735" y1="710" x2="1060" y2="705" class="relation" marker-end="url(#arrow)"/>
    <text x="897.5" y="700.5" class="edge-label" text-anchor="middle">system parent</text>
  </g>
<g><rect x="1160" y="315" width="290" height="34" rx="17" class="note-box"/><text x="1305" y="337" class="note" text-anchor="middle">first_slot is the Device-local position</text></g>
<g><rect x="775" y="555" width="300" height="34" rx="17" class="note-box"/><text x="925" y="577" class="note" text-anchor="middle">V.R.b spans EN_FIRMWARE + EN_BUILDS</text></g>
  <text x="50" y="876" class="legend">Solid arrows show established catalogue relationships. Purple headers are association tables.</text>
</svg>