    <path d="M897,130 H1153 Q1160,130 1160,137 V166 H890 V137 Q890,130 897,130" fill="#5b3f86"/>
    <text x="1025" y="154" class="entity-title" text-anchor="middle">AS_OBJECT_FIRMWARE</text>
    <text x="904" y="187" class="field">PK id_object_firmware</text><text x="904" y="207" class="field">FK id_firmware</text><text x="904" y="227" class="field">FK id_key_object</text>
  </g>
<g class="entity">
