<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Configuration ownership and validation model</title>
  <desc id="desc">Object- and firmware-scoped configuration definitions, ranges, contextual filters, slot conditions, and conversion rules.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50606b"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#50606b"/></marker>
    <style>
      .title{font:600 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17232b}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#50606b}
      .entity-title{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#fff}
      .field{font:400 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#22313a}
      .relation{stroke:#50606b;stroke-width:2;fill:none}
      .dashed{stroke-dasharray:7 6}
      .edge-label{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34444f;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
      .note-box{fill:#fff7df;stroke:#c99416;stroke-width:1.5}
      .note{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#634a11}
      .legend{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#50606b}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="50" y="48" class="title">Configuration ownership and validation model</text>
  <text x="50" y="76" class="subtitle">Object- and firmware-scoped configuration definitions, ranges, contextual filters, slot conditions, and conversion rules.</text>
  <g class="entity">
    <rect x="70" y="150" width="240" height="115" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M77,150 H303 Q310,150 310,157 V186 H70 V157 Q70,150 77,150" fill="#174d70"/>
    <text x="190" y="174" class="entity-title" text-anchor="middle">EN_KEY_OBJECT</text>
    <text x="84" y="207" class="field">PK id_key_object</text><text x="84" y="227" class="field">key_object</text>
  </g>
<g class="entity">
    <rect x="70" y="360" width="240" height="125" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M77,360 H303 Q310,360 310,367 V396 H70 V367 Q70,360 77,360" fill="#174d70"/>
    <text x="190" y="384" class="entity-title" text-anchor="middle">EN_FIRMWARE</text>
    <text x="84" y="417" class="field">PK id_firmware</text><text x="84" y="437" class="field">firmware_V / firmware_R</text><text x="84" y="457" class="field">slots</text>
  </g>
<g class="entity">
    <rect x="430" y="240" width="260" height="190" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M437,240 H683 Q690,240 690,247 V276 H430 V247 Q430,240 437,240" fill="#174d70"/>
    <text x="560" y="264" class="entity-title" text-anchor="middle">EN_CONF</text>
    <text x="444" y="297" class="field">PK id_conf</text><text x="444" y="317" class="field">id_key_object OR id_firmware</text><text x="444" y="337" class="field">idx, conf_name</text><text x="444" y="357" class="field">type, visible, read_only</text>
  </g>
<g class="entity">
    <rect x="800" y="110" width="245" height="120" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M807,110 H1038 Q1045,110 1045,117 V146 H800 V117 Q800,110 807,110" fill="#174d70"/>
    <text x="922.5" y="134" class="entity-title" text-anchor="middle">EN_CONF_RANGE</text>
    <text x="814" y="167" class="field">FK id_conf</text><text x="814" y="187" class="field">range/value metadata</text><text x="814" y="207" class="field">defaults / labels</text>
  </g>
<g class="entity">
    <rect x="800" y="315" width="270" height="125" rx="7" fill="#f6f2fb" stroke="#6d55a0" stroke-width="2"/>
    <path d="M807,315 H1063 Q1070,315 1070,322 V351 H800 V322 Q800,315 807,315" fill="#5b3f86"/>
    <text x="935" y="339" class="entity-title" text-anchor="middle">AS_OBJECT_FIRMWARE</text>
    <text x="814" y="372" class="field">PK id_object_firmware</text><text x="814" y="392" class="field">FK id_firmware</text><text x="814" y="412" class="field">FK id_key_object</text>
  </g>
<g class="entity">
