<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Configuration ownership and validation model</title>
  <desc id="desc">Object- and firmware-scoped configuration definitions, ranges, contextual filters, slot conditions, and conversion rules.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50606b"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#50606b"/></marker>
    <style>
      .title{font:600 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17232b}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#50606b}
      .entity-title{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#fff}
      .field{font:400 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#22313a}
      .relation{stroke:#50606b;stroke-width:2;fill:none}
      .dashed{stroke-dasharray:7 6}
      .edge-label{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#34444f;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
      .note-box{fill:#fff7df;stroke:#c99416;stroke-width:1.5}
      .note{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#634a11}
      .legend{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#50606b}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="50" y="48" class="title">Configuration ownership and validation model</text>
  <text x="50" y="76" class="subtitle">Object- and firmware-scoped configuration definitions, ranges, contextual filters, slot conditions, and conversion rules.</text>
  <g class="entity">
    <rect x="50" y="130" width="240" height="115" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M57,130 H283 Q290,130 290,137 V166 H50 V137 Q50,130 57,130" fill="#174d70"/>
    <text x="170" y="154" class="entity-title" text-anchor="middle">EN_KEY_OBJECT</text>
    <text x="64" y="187" class="field">PK id_key_object</text><text x="64" y="207" class="field">key_object</text>
  </g>
<g class="entity">
    <rect x="50" y="330" width="240" height="125" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M57,330 H283 Q290,330 290,337 V366 H50 V337 Q50,330 57,330" fill="#174d70"/>
    <text x="170" y="354" class="entity-title" text-anchor="middle">EN_FIRMWARE</text>
    <text x="64" y="387" class="field">PK id_firmware</text><text x="64" y="407" class="field">firmware_V / firmware_R</text><text x="64" y="427" class="field">slots</text>
  </g>
<g class="entity">
    <rect x="410" y="220" width="260" height="190" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M417,220 H663 Q670,220 670,227 V256 H410 V227 Q410,220 417,220" fill="#174d70"/>
    <text x="540" y="244" class="entity-title" text-anchor="middle">EN_CONF</text>
    <text x="424" y="277" class="field">PK id_conf</text><text x="424" y="297" class="field">id_key_object OR id_firmware</text><text x="424" y="317" class="field">idx, conf_name</text><text x="424" y="337" class="field">type, visible, read_only</text>
  </g>
<g class="entity">
    <rect x="790" y="95" width="245" height="120" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M797,95 H1028 Q1035,95 1035,102 V131 H790 V102 Q790,95 797,95" fill="#174d70"/>
    <text x="912.5" y="119" class="entity-title" text-anchor="middle">EN_CONF_RANGE</text>
    <text x="804" y="152" class="field">FK id_conf</text><text x="804" y="172" class="field">range/value metadata</text><text x="804" y="192" class="field">defaults / labels</text>
  </g>
<g class="entity">
