    <path d="M1187,220 H1413 Q1420,220 1420,227 V256 H1180 V227 Q1180,220 1187,220" fill="#174d70"/>
    <text x="1300" y="244" class="entity-title" text-anchor="middle">EN_FILTER</text>
    <text x="1194" y="277" class="field">id_filter</text><text x="1194" y="297" class="field">FK id_object_firmware</text><text x="1194" y="317" class="field">FK id_conf</text><text x="1194" y="337" class="field">whole_range</text>
  </g>
<g class="entity">
    <rect x="1180" y="460" width="240" height="105" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M1187,460 H1413 Q1420,460 1420,467 V496 H1180 V467 Q1180,460 1187,460" fill="#174d70"/>
    <text x="1300" y="484" class="entity-title" text-anchor="middle">EN_FILTER_RANGE</text>
    <text x="1194" y="517" class="field">id_filter</text><text x="1194" y="537" class="field">range</text>
  </g>
<g class="entity">
    <rect x="650" y="620" width="245" height="125" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M657,620 H888 Q895,620 895,627 V656 H650 V627 Q650,620 657,620" fill="#174d70"/>
    <text x="772.5" y="644" class="entity-title" text-anchor="middle">EN_SLOTS</text>
    <text x="664" y="677" class="field">PK id_slot</text><text x="664" y="697" class="field">FK id_object_firmware</text><text x="664" y="717" class="field">first_slot, fixed_ko</text>
  </g>
<g class="entity">
    <rect x="1010" y="625" width="250" height="105" rx="7" fill="#f6f2fb" stroke="#6d55a0" stroke-width="2"/>
    <path d="M1017,625 H1253 Q1260,625 1260,632 V661 H1010 V632 Q1010,625 1017,625" fill="#5b3f86"/>
    <text x="1135" y="649" class="entity-title" text-anchor="middle">AS_SLOT_CONDITION</text>
    <text x="1024" y="682" class="field">FK id_slot</text><text x="1024" y="702" class="field">FK id_condition</text>
  </g>
<g class="entity">
    <rect x="1180" y="760" width="240" height="110" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M1187,760 H1413 Q1420,760 1420,767 V796 H1180 V767 Q1180,760 1187,760" fill="#174d70"/>
    <text x="1300" y="784" class="entity-title" text-anchor="middle">EN_CONDITION</text>
    <text x="1194" y="817" class="field">PK id_condition</text><text x="1194" y="837" class="field">condition</text><text x="1194" y="857" class="field">id_conv_rule</text>
  </g>
<g class="entity">
    <rect x="760" y="785" width="260" height="105" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M767,785 H1013 Q1020,785 1020,792 V821 H760 V792 Q760,785 767,785" fill="#174d70"/>
    <text x="890" y="809" class="entity-title" text-anchor="middle">EN_CONV_RULE</text>
    <text x="774" y="842" class="field">item_conf/value</text><text x="774" y="862" class="field">object_conf/value</text><text x="774" y="882" class="field">jump / always_true</text>
  </g>
<g>
    <line x1="290" y1="188" x2="410" y2="270" class="relation" marker-end="url(#arrow)"/>
    <text x="350" y="222" class="edge-label" text-anchor="middle">Object-scoped; firmware = 0</text>
  </g>
<g>
    <line x1="290" y1="392" x2="410" y2="360" class="relation" marker-end="url(#arrow)"/>
    <text x="350" y="369" class="edge-label" text-anchor="middle">firmware-scoped; Object = 0</text>
  </g>
<g>
    <line x1="670" y1="270" x2="790" y2="155" class="relation" marker-end="url(#arrow)"/>
    <text x="730" y="205.5" class="edge-label" text-anchor="middle">base domain</text>
  </g>
<g><polyline points="670,315 1110,315 1110,295 1180,295" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="890" y="305" class="edge-label" text-anchor="middle">property</text></g>
<g>
    <line x1="1060" y1="452" x2="1180" y2="340" class="relation" marker-end="url(#arrow)"/>
    <text x="1120" y="389" class="edge-label" text-anchor="middle">Object/firmware context</text>
  </g>
<g>
    <line x1="1300" y1="370" x2="1300" y2="460" class="relation" marker-end="url(#arrow)"/>
    <text x="1300" y="408" class="edge-label" text-anchor="middle">allowed subset</text>
  </g>
<g>
    <line x1="925" y1="515" x2="772" y2="620" class="relation" marker-end="url(#arrow)"/>
    <text x="848.5" y="560.5" class="edge-label" text-anchor="middle">slot placement</text>
  </g>
<g>
    <line x1="895" y1="682" x2="1010" y2="682" class="relation" marker-end="url(#arrow)"/>
    <text x="952.5" y="675" class="edge-label" text-anchor="middle">condition link</text>
  </g>
<g>
    <line x1="1260" y1="730" x2="1300" y2="760" class="relation" marker-end="url(#arrow)"/>
    <text x="1280" y="738" class="edge-label" text-anchor="middle">condition</text>
  </g>
<g><polyline points="1180,815 1080,815 1080,837 1020,837" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="1090" y="805" class="edge-label" text-anchor="middle">conversion rule</text></g>
<g><rect x="60" y="525" width="275" height="34" rx="17" class="note-box"/><text x="197.5" y="547" class="note" text-anchor="middle">EN_CONF ownership is polymorphic</text></g>
<g><rect x="1090" y="95" width="320" height="34" rx="17" class="note-box"/><text x="1250" y="117" class="note" text-anchor="middle">Transport range ≠ final valid domain</text></g>
  <text x="50" y="896" class="legend">Validation proceeds from property definition through context-specific filters, conditions, and conversions.</text>
</svg>