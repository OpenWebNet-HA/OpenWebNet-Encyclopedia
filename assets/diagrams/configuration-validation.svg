    <path d="M1197,265 H1423 Q1430,265 1430,272 V301 H1190 V272 Q1190,265 1197,265" fill="#174d70"/>
    <text x="1310" y="289" class="entity-title" text-anchor="middle">EN_FILTER</text>
    <text x="1204" y="322" class="field">id_filter</text><text x="1204" y="342" class="field">FK id_object_firmware</text><text x="1204" y="362" class="field">FK id_conf</text><text x="1204" y="382" class="field">whole_range</text>
  </g>
<g class="entity">
    <rect x="1190" y="520" width="240" height="105" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M1197,520 H1423 Q1430,520 1430,527 V556 H1190 V527 Q1190,520 1197,520" fill="#174d70"/>
    <text x="1310" y="544" class="entity-title" text-anchor="middle">EN_FILTER_RANGE</text>
    <text x="1204" y="577" class="field">id_filter</text><text x="1204" y="597" class="field">range</text>
  </g>
<g class="entity">
    <rect x="430" y="600" width="245" height="125" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M437,600 H668 Q675,600 675,607 V636 H430 V607 Q430,600 437,600" fill="#174d70"/>
    <text x="552.5" y="624" class="entity-title" text-anchor="middle">EN_SLOTS</text>
    <text x="444" y="657" class="field">PK id_slot</text><text x="444" y="677" class="field">FK id_object_firmware</text><text x="444" y="697" class="field">first_slot, fixed_ko</text>
  </g>
<g class="entity">
    <rect x="800" y="610" width="250" height="105" rx="7" fill="#f6f2fb" stroke="#6d55a0" stroke-width="2"/>
    <path d="M807,610 H1043 Q1050,610 1050,617 V646 H800 V617 Q800,610 807,610" fill="#5b3f86"/>
    <text x="925" y="634" class="entity-title" text-anchor="middle">AS_SLOT_CONDITION</text>
    <text x="814" y="667" class="field">FK id_slot</text><text x="814" y="687" class="field">FK id_condition</text>
  </g>
<g class="entity">
    <rect x="1160" y="700" width="240" height="110" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M1167,700 H1393 Q1400,700 1400,707 V736 H1160 V707 Q1160,700 1167,700" fill="#174d70"/>
    <text x="1280" y="724" class="entity-title" text-anchor="middle">EN_CONDITION</text>
    <text x="1174" y="757" class="field">PK id_condition</text><text x="1174" y="777" class="field">condition</text><text x="1174" y="797" class="field">id_conv_rule</text>
  </g>
<g class="entity">
    <rect x="790" y="770" width="260" height="105" rx="7" fill="#f3f8fb" stroke="#2b6f97" stroke-width="2"/>
    <path d="M797,770 H1043 Q1050,770 1050,777 V806 H790 V777 Q790,770 797,770" fill="#174d70"/>
    <text x="920" y="794" class="entity-title" text-anchor="middle">EN_CONV_RULE</text>
    <text x="804" y="827" class="field">item_conf/value</text><text x="804" y="847" class="field">object_conf/value</text><text x="804" y="867" class="field">jump / always_true</text>
  </g>
<g>
    <line x1="310" y1="205" x2="430" y2="285" class="relation" marker-end="url(#arrow)"/>
    <text x="370" y="238" class="edge-label" text-anchor="middle">Object-scoped; firmware = 0</text>
  </g>
<g>
    <line x1="310" y1="420" x2="430" y2="380" class="relation" marker-end="url(#arrow)"/>
    <text x="370" y="393" class="edge-label" text-anchor="middle">firmware-scoped; Object = 0</text>
  </g>
<g>
    <line x1="690" y1="285" x2="800" y2="170" class="relation" marker-end="url(#arrow)"/>
    <text x="745" y="220.5" class="edge-label" text-anchor="middle">base domain</text>
  </g>
<g>
    <line x1="1070" y1="375" x2="1190" y2="340" class="relation" marker-end="url(#arrow)"/>
    <text x="1130" y="350.5" class="edge-label" text-anchor="middle">context</text>
  </g>
<g><polyline points="690,335 1110,335 1110,360 1190,360" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="900" y="324" class="edge-label" text-anchor="middle">property</text></g>
<g>
    <line x1="1310" y1="415" x2="1310" y2="520" class="relation" marker-end="url(#arrow)"/>
    <text x="1310" y="460.5" class="edge-label" text-anchor="middle">allowed subset</text>
  </g>
<g><polyline points="930,440 930,520 552,520 552,600" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="760" y="510" class="edge-label" text-anchor="middle">slot placement</text></g>
<g>
    <line x1="675" y1="662" x2="800" y2="662" class="relation" marker-end="url(#arrow)"/>
    <text x="737.5" y="655" class="edge-label" text-anchor="middle">condition link</text>
  </g>
<g>
    <line x1="1050" y1="680" x2="1160" y2="745" class="relation" marker-end="url(#arrow)"/>
    <text x="1105" y="705.5" class="edge-label" text-anchor="middle">condition</text>
  </g>
<g><polyline points="1160,785 1100,785 1100,822 1050,822" class="relation" marker-end="url(#arrow)" fill="none"/>
  <text x="1105" y="810" class="edge-label" text-anchor="middle">conversion rule</text></g>
<g><rect x="90" y="535" width="275" height="34" rx="17" class="note-box"/><text x="227.5" y="557" class="note" text-anchor="middle">EN_CONF ownership is polymorphic</text></g>
<g><rect x="1110" y="115" width="320" height="34" rx="17" class="note-box"/><text x="1270" y="137" class="note" text-anchor="middle">Transport range ≠ final valid domain</text></g>
  <text x="50" y="896" class="legend">Validation proceeds from property definition through context-specific filters, conditions, and conversions.</text>
</svg>