    <path d="M797,390 H1053 Q1060,390 1060,397 V426 H790 V397 Q790,390 797,390" fill="#5b3f86"/>
    <text x="925" y="414" class="entity-title" text-anchor="middle">AS_OBJECT_FIRMWARE</text>
    <text x="804" y="447" class="field">PK id_object_firmware</text><text x="804" y="467" class="field">FK id_firmware</text><text x="804" y="487" class="field">FK id_key_object</text>
  </g>
