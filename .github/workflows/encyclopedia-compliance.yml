name: Encyclopedia compliance

on:
  pull_request:
    branches:
      - main
      - machine-knowledge-base
      - docs/devices-foundation
  push:
    branches:
      - main
      - machine-knowledge-base
      - docs/devices-foundation
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  git-storage:
    name: Git storage policy
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git objects and comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Test Git storage guard
        run: python -m unittest discover -s project/review/checks/tests -p test_git_storage.py -v

      - name: Reject oversized new Git blobs and ordinary review TSVs
        env:
          STORAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          args=(--head HEAD)
          if [[ -n "$STORAGE_BASE" && "$STORAGE_BASE" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--base "$STORAGE_BASE")
          fi
          python project/review/checks/check_git_storage.py "${args[@]}"

  mechanical-compliance:
    name: Mechanical ESG and ECV compliance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with: {lfs: true}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile validation scripts
        run: |
          python -m py_compile             project/review/checks/check_esg.py             project/review/checks/check_ecv.py             project/review/checks/audit_epistemic_drift.py             project/review/checks/audit_source_coverage.py             project/review/checks/check_artifact_manifest.py

      - name: Enforce Encyclopedia Style Guide
        run: python project/review/checks/check_esg.py .

      - name: Enforce deterministic Encyclopedia Core Values rules
        run: python project/review/checks/check_ecv.py .

      - name: Enforce Machine KB privacy when present
        shell: bash
        run: |
          if [[ -f knowledge/tools/validate_privacy.py ]]; then
            python knowledge/tools/validate_privacy.py
          else
            echo "Machine KB privacy validator not present on this branch; skipped."
          fi

      - name: Install evidence validation dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Validate canonical evidence packages
        run: python evidence/validate_evidence.py

      - name: Run evidence acceptance tests
        run: python -m pytest evidence/tests

  source-integrity:
    name: Source integrity and reproducibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source-audit dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Verify external artifact manifest
        run: python project/review/checks/check_artifact_manifest.py

      - name: Require exact-commit canonical-source and catalogue validation
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOGUE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python devices/tools/catalogue_ci_status.py verify --commit "$CATALOGUE_COMMIT" --output source-audit-status.json

      - name: Test fail-closed source-status verification
        run: python -m unittest discover -s devices/tools/tests -p test_ci_catalogue.py -v

      - name: Preserve source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-integrity-audit
          path: source-audit-status.json
          if-no-files-found: ignore

  epistemic-review:
    name: Advisory epistemic review
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate review queues
        shell: bash
        run: |
          {
            python project/review/checks/audit_epistemic_drift.py . --show-candidates
            python project/review/checks/check_ecv.py . --show-candidates
          } | tee epistemic-review.txt

      - name: Add review queue to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Advisory ECV review queue"
            echo
            echo "These findings require evidence-aware review and do not constitute factual verdicts."
            echo
            echo '~~~text'
            head -n 200 epistemic-review.txt 2>/dev/null || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve full epistemic review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-review
          path: epistemic-review.txt
          if-no-files-found: ignore
