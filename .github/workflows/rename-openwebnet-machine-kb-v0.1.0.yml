name: Rename OpenWebNet Machine KB 0.1.0 release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-openwebnet-machine-kb-v0.1.0.yml

permissions:
  contents: write

jobs:
  rename-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename release display metadata
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "machine-kb-v0.1.0"
          expected = "0b6651604581e428b58a071a96bd76c2ba2ba179"
          actual = subprocess.run(
              ["git", "rev-list", "-n1", tag],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          if actual != expected:
              raise SystemExit(f"unexpected tag target: {actual}")

          raw = subprocess.run(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "name,body"],
              capture_output=True, text=True, check=True,
          ).stdout
          release = json.loads(raw)
          body = release["body"]
          old_heading = "# Machine KB 0.1.0 Release Notes"
          new_heading = "# OpenWebNet Machine KB 0.1.0 Release Notes"
          if old_heading in body:
              body = body.replace(old_heading, new_heading, 1)
          elif new_heading not in body:
              raise SystemExit("release heading does not match expected old or new form")

          notes = Path("/tmp/release-notes.md")
          notes.write_text(body, encoding="utf-8")
          subprocess.run(
              [
                  "gh", "release", "edit", tag,
                  "--repo", repo,
                  "--title", "OpenWebNet Machine KB 0.1.0",
                  "--notes-file", str(notes),
              ],
              check=True,
          )
