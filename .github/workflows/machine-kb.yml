name: Machine KB validation
on:
  pull_request:
    branches: [main, machine-knowledge-base]
  push:
    branches: [main, machine-knowledge-base]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  machine-kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -r knowledge/tools/requirements-schema.txt
      - name: Unit tests
        run: python -m unittest discover -s knowledge/tests -v
      - name: Schema validation
        run: python -m unittest discover -s knowledge/tools -p 'test_schema.py' -v
      - name: Build freshness (never commit)
        run: |
          python build.py
          git diff --exit-code -- knowledge
      - name: Deterministic integrity, claims, and privacy
        run: python check.py

  publish-0-1-2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python -c 'import json,os,urllib.request;
          repo=os.environ["GITHUB_REPOSITORY"];
          body="OpenWebNet Machine KB 0.1.2 is the clean post-migration baseline.\n\nThe previous 0.1.0 and 0.1.1 releases and tags were withdrawn after the documentation binaries they referenced were migrated out of Git history to the OpenWebNet archive on Cloudflare R2. Those older tags kept the migrated PDF objects reachable in the repository, preventing the repository storage cleanup from taking effect.\n\nNo Machine KB content was intentionally rolled back by this cleanup. Version 0.1.2 points to the cleaned repository state, while document provenance, hashes, and archive references remain preserved in repository metadata.";
          payload={"tag_name":"machine-kb-v0.1.2","name":"OpenWebNet Machine KB 0.1.2","body":body,"draft":False,"prerelease":False,"make_latest":"true"};
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/releases",data=json.dumps(payload).encode(),method="POST",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"});
          print(urllib.request.urlopen(req).read().decode())'
