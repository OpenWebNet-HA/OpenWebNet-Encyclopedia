name: Machine KB validation
on:
  pull_request:
    branches: [main, machine-knowledge-base]
  push:
    branches: [main, machine-knowledge-base]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine-kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -r knowledge/tools/requirements-schema.txt
      - name: Unit tests
        run: python -m unittest discover -s knowledge/tests -v
      - name: Schema validation
        run: python -m unittest discover -s knowledge/tools -p 'test_schema.py' -v
      - name: Build freshness (never commit)
        run: |
          python build.py
          git diff --exit-code -- knowledge
      - name: Deterministic integrity, claims, and privacy
        run: python check.py
