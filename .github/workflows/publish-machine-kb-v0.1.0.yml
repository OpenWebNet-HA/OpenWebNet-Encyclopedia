name: Publish Machine KB 0.1.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-machine-kb-v0.1.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: machine-kb-v0.1.0
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0b6651604581e428b58a071a96bd76c2ba2ba179"
          test "$(git rev-list -n1 machine-kb-v0.1.0)" = "0b6651604581e428b58a071a96bd76c2ba2ba179"

      - name: Prepare public release notes
        shell: python
        run: |
          from pathlib import Path

          path = Path("project/machine-kb/release-notes.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "**Release identity:** OpenWebNet Machine KB 0.1.0, intended Git tag `machine-kb-v0.1.0`.",
              "**Release identity:** OpenWebNet Machine KB 0.1.0, Git tag `machine-kb-v0.1.0`.",
          )
          text = text.replace(
              "This document describes the exact initial public Machine KB release prepared from `main`. Creating the Git tag and GitHub Release is a separate formal release action and is not performed by this preparation commit.\n\n",
              "This is the initial public release of the OpenWebNet Machine KB.\n\n",
          )
          text = text.replace(
              "- The exact released Git revision is the commit referenced by `machine-kb-v0.1.0` when the formal release action is authorized.",
              "- Exact released Git revision: `0b6651604581e428b58a071a96bd76c2ba2ba179`.",
          )
          text = text.replace(
              "The formal tag and GitHub Release must point to that validated revision without intervening changes.",
              "The tag and GitHub Release point to the validated revision `0b6651604581e428b58a071a96bd76c2ba2ba179`.",
          )
          Path("/tmp/machine-kb-v0.1.0-release-notes.md").write_text(text, encoding="utf-8")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view machine-kb-v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          gh release create machine-kb-v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Machine KB 0.1.0" \
            --notes-file /tmp/machine-kb-v0.1.0-release-notes.md \
            --verify-tag \
            --latest
