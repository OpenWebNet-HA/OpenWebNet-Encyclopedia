name: Machine knowledge privacy

on:
  pull_request:
    paths:
      - "knowledge/**"
      - ".github/workflows/knowledge-privacy.yml"
  push:
    paths:
      - "knowledge/**"
      - ".github/workflows/knowledge-privacy.yml"

jobs:
  validate-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Machine KB schema dependencies
        run: python -m pip install --disable-pip-version-check -r knowledge/tools/requirements-schema.txt
      - name: Test source classification and pre-extraction sanitization
        # The complete regression suite runs in machine-kb.yml. Keep this gate
        # focused on privacy rather than running the same full suite twice.
        run: >-
          python -m unittest discover -s knowledge/tests -p test_privacy_pipeline.py -v
      - name: Test factory-source preparation and generated-text hygiene
        run: |
          python -m unittest discover -s knowledge/tests -p test_factory_credential_preparation.py -v
          python -m unittest discover -s knowledge/tests -p test_text_hygiene.py -v
      - name: Reject private values in generated artifacts
        run: python knowledge/tools/validate_privacy.py
