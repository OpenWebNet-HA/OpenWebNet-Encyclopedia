name: Update Machine KB 0.1.0 known issues
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-machine-kb-v0.1.0-known-issues.yml

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          test "$(git rev-list -n1 machine-kb-v0.1.0)" = "0b6651604581e428b58a071a96bd76c2ba2ba179"
          test "$(gh release view machine-kb-v0.1.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"

      - name: Add known issues
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "machine-kb-v0.1.0"
          raw = subprocess.run(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "body"],
              check=True, capture_output=True, text=True,
          ).stdout
          body = json.loads(raw)["body"]
          if "## Known issues" in body:
              raise SystemExit("Known issues section already exists; refusing to duplicate it.")

          known = (
              "\n\n## Known issues\n\n"
              "- **Generated claim statement rendering:** 1,120 of 7,449 claim statements can contain leaked internal Markdown parser representation when materialized source context crosses a table. "
              "The affected text is limited to `claims.jsonl` statements; retrieval chunks and reference registries are unaffected. "
              "Consumers should prefer the corresponding retrieval chunk for an affected claim until this is corrected. Tracked in #37.\n"
              "- **Schema vocabulary documentation:** `knowledge/schema/README.md` omits the `exposes`, `identifies`, and `distinct_from` relationship predicates, "
              "as well as the schema's `entity_type` vocabulary. The JSON Schema itself is correct. Tracked in #38.\n"
          )
          notes = Path("/tmp/release-notes.md")
          notes.write_text(body.rstrip() + known, encoding="utf-8")
          subprocess.run(
              ["gh", "release", "edit", tag, "--repo", repo, "--notes-file", str(notes)],
              check=True,
          )
