purpose: Authoritative inventory of vendor-origin artifacts stored outside Git.
policy:
  git: Git stores project-authored analysis and artifact provenance/metadata, not vendor-origin binary artifacts.
  documents: Public publisher documentation is stored in openwebnet-documents and may have a public archive URL.
  data: Canonical vendor databases and support data are stored privately in openwebnet-data.
  software: Installers and firmware are stored privately in openwebnet-software.
  language: Documentation artifacts always carry a language list. ISO 639-1 codes are used for established single languages. ISO 639 special codes
    mul and und denote multilingual and undetermined content.
storage:
  openwebnet-documents:
    visibility: public
